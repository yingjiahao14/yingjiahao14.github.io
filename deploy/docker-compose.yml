services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /var/www/site:/srv/site:ro
      - ./logs:/var/log/caddy
      - caddy_data:/data
      - caddy_config:/config

  matomo:
    image: matomo:5
    restart: unless-stopped
    environment:
      MATOMO_DATABASE_HOST: matomo_db
      MATOMO_DATABASE_ADAPTER: mysqli
      MATOMO_DATABASE_DBNAME: matomo
      MATOMO_DATABASE_USERNAME: matomo
      MATOMO_DATABASE_PASSWORD: ${MATOMO_DB_PASSWORD}
    volumes:
      - matomo_data:/var/www/html
    depends_on:
      matomo_db:
        condition: service_healthy

  matomo_db:
    image: mariadb:11
    restart: unless-stopped
    # 小内存机器: 压低 innodb 缓冲池
    command: --max-allowed-packet=64MB --innodb-buffer-pool-size=128M
    environment:
      MARIADB_DATABASE: matomo
      MARIADB_USER: matomo
      MARIADB_PASSWORD: ${MATOMO_DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${MATOMO_DB_ROOT_PASSWORD}
    volumes:
      - matomo_db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  caddy_data:
  caddy_config:
  matomo_data:
  matomo_db:
