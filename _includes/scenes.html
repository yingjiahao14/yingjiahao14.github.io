{% when 'ufeval' %}
<svg class="scene s-ufeval" viewBox="0 0 132 94" aria-hidden="true">
<!-- the one unified judge -->
<g transform="translate(5,30)"><g class="bot">
  <path class="ln" d="M13 4.5v3"/><circle class="ac" cx="13" cy="3" r="1.6"/>

  <circle class="ac-s" cx="0" cy="0" r="6.5"/><path class="ac-s" d="M4.6 4.6L8.5 8.5"/>

<rect class="ln-m fillsurf ufeval-c3" x="80" y="60" width="32" height="20" rx="3.5"/>
<rect class="ln-m" x="84" y="65" width="10" height="10" rx="1.5"/>
<path class="ln-m" d="M85.5 73l2.5-3 2 2.2 2.5-2.7"/>

<g transform="translate(120,42)"><g class="ufeval-t2"><path class="ac-s" d="M-3.5 0l2.4 2.4L4.2-2.4"/></g></g>

{% when 'conflict' %}
<svg class="scene s-conflict" viewBox="0 0 132 94" aria-hidden="true">
<!-- neutral axis: the line it keeps crossing -->
<path class="ln-m" d="M66 34v50" stroke-dasharray="2.5 4" opacity=".45"/>

<!-- its own memory: a thought bubble that says YES -->
<g transform="translate(4,8)"><g class="conflict-mem" style="transform-origin:center;transform-box:fill-box">
  <rect class="ln fillbg" width="34" height="17" rx="5"/>

  <path class="ln-m" d="M18 6h9M18 11.5h6"/>
</g></g>

<!-- the external prompt: a speech bubble that says NO -->
<g transform="translate(94,8)"><g class="conflict-pmt" style="transform-origin:center;transform-box:fill-box">
  <path class="ln fillbg" d="M0 0h34v17H12l-4 4v-4H0z"/>

  <path class="ln-m" d="M7 6h9M7 11.5h6"/>
</g></g>

<!-- the two pulls -->

<path class="ac-s conflict-pr" d="M90 57.5h8M94.5 54l3.5 3.5-3.5 3.5"/>

<!-- the model, tugged back and forth -->
<g transform="translate(49.8,38.2) scale(1.25)"><g class="conflict-sway" style="transform-origin:center;transform-box:fill-box"><g class="bot">
  <path class="ln" d="M13 4.5v3"/><circle class="ac" cx="13" cy="3" r="1.6"/>

  <path class="ln" d="M10 19q3 1.8 6 0"/>
</g></g></g>

<text class="tiny" x="6" y="80">intuitive</text>
<text class="tiny" x="126" y="80" text-anchor="end">dependent</text>
