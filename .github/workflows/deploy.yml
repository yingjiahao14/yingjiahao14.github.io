name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  SERVER_IP: 43.135.176.190
  SERVER_USER: ubuntu
  SERVER_PORT: 28022

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 与 GitHub Pages 完全相同的构建环境
      - name: Build with Jekyll (GitHub Pages environment)
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Fix permissions
        run: sudo chown -R "$USER" ./_site

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$SERVER_PORT" -H "$SERVER_IP" >> ~/.ssh/known_hosts

      - name: Rsync to server
        run: |
          # 部署密钥为 rrsync 受限钥匙, 根路径已映射到网站目录
          rsync -avz --delete -e "ssh -p $SERVER_PORT" ./_site/ "$SERVER_USER@$SERVER_IP:/"
